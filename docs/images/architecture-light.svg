<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1005" width="640" height="1005" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="24">
<title id="t">Intune-WUO architecture</title>
<desc id="d">Intune and Windows Autopatch deliver policy, a config package, the Win32 app and the Remediation to the device. On the device the IntuneWUO engine reads Intune policy and legacy sources, applies safe fixes, runs a fallback task, and reports through logs and the Remediation output.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="640" height="1005" fill="#ffffff"/>
<rect x="10" y="20" width="620" height="351" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="320" y="54" text-anchor="middle" font-weight="bold" fill="#1f2328">Intune + Windows Autopatch (cloud)</text>
<rect x="10" y="427" width="620" height="417" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="320" y="461" text-anchor="middle" font-weight="bold" fill="#1f2328">Windows device</text>
<rect x="30" y="72" width="560" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="310" y="106.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Autopatch policies: rings, approvals,</text>
<text x="310" y="137.2" text-anchor="middle" font-weight="normal" fill="#1f2328">hotpatch</text>
<rect x="30" y="169" width="273" height="116" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="166.5" y="218.7" text-anchor="middle" font-weight="normal" fill="#1f2328">Config package:</text>
<text x="166.5" y="249.7" text-anchor="middle" font-weight="normal" fill="#1f2328">sets the mode</text>
<rect x="317" y="169" width="273" height="116" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="453.5" y="203.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Remediation: detect</text>
<text x="453.5" y="234.2" text-anchor="middle" font-weight="normal" fill="#1f2328">and fix, every 8</text>
<text x="453.5" y="265.2" text-anchor="middle" font-weight="normal" fill="#1f2328">hours</text>
<rect x="30" y="297" width="560" height="54" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="310" y="331.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Win32 app: engine and fallback task</text>
<line x1="320" y1="371" x2="320" y2="427" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="330" y="407" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">MDM + management agent</text>
<rect x="30" y="479" width="273" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="166.5" y="513.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Intune policy</text>
<text x="166.5" y="544.2" text-anchor="middle" font-weight="normal" fill="#1f2328">(PolicyManager)</text>
<rect x="317" y="479" width="273" height="85" rx="12" fill="#fde8e8" stroke="#d14343" stroke-width="2"/>
<text x="453.5" y="513.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Legacy: GPO, WSUS,</text>
<text x="453.5" y="544.2" text-anchor="middle" font-weight="normal" fill="#1f2328">ConfigMgr</text>
<rect x="30" y="576" width="560" height="54" rx="12" fill="#e6f6ea" stroke="#2e9e5b" stroke-width="2"/>
<text x="310" y="610.2" text-anchor="middle" font-weight="bold" fill="#1f2328">IntuneWUO engine: detect, fix, fallback</text>
<rect x="30" y="642" width="273" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="166.5" y="676.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Mode and settings</text>
<text x="166.5" y="707.2" text-anchor="middle" font-weight="normal" fill="#1f2328">(registry)</text>
<rect x="317" y="642" width="273" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="453.5" y="676.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Fallback task</text>
<text x="453.5" y="707.2" text-anchor="middle" font-weight="normal" fill="#1f2328">(SYSTEM)</text>
<rect x="30" y="739" width="273" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="166.5" y="773.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Windows Update</text>
<text x="166.5" y="804.2" text-anchor="middle" font-weight="normal" fill="#1f2328">stack</text>
<rect x="317" y="739" width="273" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="453.5" y="788.7" text-anchor="middle" font-weight="normal" fill="#1f2328">Logs and Event Log</text>
<line x1="320" y1="844" x2="320" y2="900" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="330" y="880" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">status line + logs</text>
<rect x="30" y="900" width="580" height="85" rx="12" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/>
<text x="320" y="934.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Intune: Remediation output and Collect</text>
<text x="320" y="965.2" text-anchor="middle" font-weight="normal" fill="#1f2328">diagnostics</text>
</svg>