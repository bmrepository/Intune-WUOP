<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1329" width="640" height="1329" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="24">
<title id="t">Detect and remediate flow</title>
<desc id="d">Every 8 hours the Remediation checks the mode, collects device state, reports blockers, and only if the mode and switches allow, applies safe fixes with repeat suppression, then writes logs and a status line.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="640" height="1329" fill="#ffffff"/>
<rect x="20" y="20" width="360" height="85" rx="12" fill="#e6f6ea" stroke="#2e9e5b" stroke-width="2"/>
<text x="200" y="54.2" text-anchor="middle" font-weight="bold" fill="#1f2328">Remediation runs every 8</text>
<text x="200" y="85.2" text-anchor="middle" font-weight="bold" fill="#1f2328">hours</text>
<line x1="200" y1="105" x2="200" y2="145" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="145" width="360" height="54" rx="12" fill="#fff4d6" stroke="#b8860b" stroke-width="3"/>
<text x="200" y="179.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Mode is Off?</text>
<rect x="440" y="114" width="180" height="116" rx="12" fill="#fde8e8" stroke="#d14343" stroke-width="2"/>
<text x="530" y="148.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Yes: stop.</text>
<text x="530" y="179.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Reports</text>
<text x="530" y="210.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Disabled</text>
<line x1="380" y1="172" x2="440" y2="172" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="160" text-anchor="middle" font-size="20" font-weight="bold" fill="#57606a">Yes</text>
<line x1="200" y1="199" x2="200" y2="270" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="210" y="242.5" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">No</text>
<rect x="20" y="270" width="360" height="116" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="200" y="304.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Collect device state:</text>
<text x="200" y="335.2" text-anchor="middle" font-weight="normal" fill="#1f2328">policy, services, pauses,</text>
<text x="200" y="366.2" text-anchor="middle" font-weight="normal" fill="#1f2328">sync, disk, Autopatch</text>
<line x1="200" y1="386" x2="200" y2="426" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="426" width="360" height="54" rx="12" fill="#fff4d6" stroke="#b8860b" stroke-width="3"/>
<text x="200" y="460.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Blockers found?</text>
<rect x="440" y="410.5" width="180" height="85" rx="12" fill="#e6f6ea" stroke="#2e9e5b" stroke-width="2"/>
<text x="530" y="444.7" text-anchor="middle" font-weight="normal" fill="#1f2328">No:</text>
<text x="530" y="475.7" text-anchor="middle" font-weight="normal" fill="#1f2328">Compliant</text>
<line x1="380" y1="453" x2="440" y2="453" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="441" text-anchor="middle" font-size="20" font-weight="bold" fill="#57606a">No</text>
<line x1="200" y1="480" x2="200" y2="536" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="210" y="516" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">Yes</text>
<rect x="20" y="536" width="360" height="85" rx="12" fill="#fff4d6" stroke="#b8860b" stroke-width="3"/>
<text x="200" y="570.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Mode and switches allow a</text>
<text x="200" y="601.2" text-anchor="middle" font-weight="normal" fill="#1f2328">fix?</text>
<rect x="440" y="536" width="180" height="85" rx="12" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/>
<text x="530" y="570.2" text-anchor="middle" font-weight="normal" fill="#1f2328">No: report</text>
<text x="530" y="601.2" text-anchor="middle" font-weight="normal" fill="#1f2328">only</text>
<line x1="380" y1="578.5" x2="440" y2="578.5" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="566.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#57606a">No</text>
<line x1="200" y1="621" x2="200" y2="661" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="210" y="649" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">Yes</text>
<rect x="20" y="661" width="360" height="116" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="200" y="695.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Detect exits 1.</text>
<text x="200" y="726.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Remediation script runs</text>
<text x="200" y="757.2" text-anchor="middle" font-weight="normal" fill="#1f2328">under a lock</text>
<line x1="200" y1="777" x2="200" y2="817" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="817" width="360" height="85" rx="12" fill="#fff4d6" stroke="#b8860b" stroke-width="3"/>
<text x="200" y="851.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Fixable, switch on, not a</text>
<text x="200" y="882.2" text-anchor="middle" font-weight="normal" fill="#1f2328">repeat?</text>
<rect x="440" y="801.5" width="180" height="116" rx="12" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/>
<text x="530" y="835.7" text-anchor="middle" font-weight="normal" fill="#1f2328">No:</text>
<text x="530" y="866.7" text-anchor="middle" font-weight="normal" fill="#1f2328">reported,</text>
<text x="530" y="897.7" text-anchor="middle" font-weight="normal" fill="#1f2328">not changed</text>
<line x1="380" y1="859.5" x2="440" y2="859.5" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="847.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#57606a">No</text>
<line x1="200" y1="902" x2="200" y2="958" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="210" y="938" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">Yes</text>
<rect x="20" y="958" width="360" height="85" rx="12" fill="#eaf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="200" y="992.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Apply fix. Log before and</text>
<text x="200" y="1023.2" text-anchor="middle" font-weight="normal" fill="#1f2328">after</text>
<line x1="200" y1="1043" x2="200" y2="1083" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="1083" width="360" height="85" rx="12" fill="#fff4d6" stroke="#b8860b" stroke-width="3"/>
<text x="200" y="1117.2" text-anchor="middle" font-weight="normal" fill="#1f2328">Same fix needed 3 times in</text>
<text x="200" y="1148.2" text-anchor="middle" font-weight="normal" fill="#1f2328">7 days?</text>
<rect x="440" y="1067.5" width="180" height="116" rx="12" fill="#fde8e8" stroke="#d14343" stroke-width="2"/>
<text x="530" y="1101.7" text-anchor="middle" font-weight="normal" fill="#1f2328">Yes:</text>
<text x="530" y="1132.7" text-anchor="middle" font-weight="normal" fill="#1f2328">suppressed,</text>
<text x="530" y="1163.7" text-anchor="middle" font-weight="normal" fill="#1f2328">reported</text>
<line x1="380" y1="1125.5" x2="440" y2="1125.5" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="1113.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#57606a">Yes</text>
<line x1="200" y1="1168" x2="200" y2="1224" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="210" y="1204" text-anchor="start" font-size="20" font-weight="bold" fill="#57606a">No</text>
<rect x="20" y="1224" width="360" height="85" rx="12" fill="#e6f6ea" stroke="#2e9e5b" stroke-width="2"/>
<text x="200" y="1258.2" text-anchor="middle" font-weight="bold" fill="#1f2328">Write logs, events and the</text>
<text x="200" y="1289.2" text-anchor="middle" font-weight="bold" fill="#1f2328">status line to Intune</text>
</svg>