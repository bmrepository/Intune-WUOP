<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1005" width="640" height="1005" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="24">
<title id="t">Intune-WUO architecture</title>
<desc id="d">Intune and Windows Autopatch deliver policy, a config package, the Win32 app and the Remediation to the device. On the device the IntuneWUO engine reads Intune policy and legacy sources, applies safe fixes, runs a fallback task, and reports through logs and the Remediation output.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9da7b3"/></marker></defs>
<rect width="640" height="1005" fill="#0d1117"/>
<rect x="10" y="20" width="620" height="351" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="320" y="54" text-anchor="middle" font-weight="bold" fill="#e6edf3">Intune + Windows Autopatch (cloud)</text>
<rect x="10" y="427" width="620" height="417" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="320" y="461" text-anchor="middle" font-weight="bold" fill="#e6edf3">Windows device</text>
<rect x="30" y="72" width="560" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="310" y="106.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Autopatch policies: rings, approvals,</text>
<text x="310" y="137.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">hotpatch</text>
<rect x="30" y="169" width="273" height="116" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="166.5" y="218.7" text-anchor="middle" font-weight="normal" fill="#e6edf3">Config package:</text>
<text x="166.5" y="249.7" text-anchor="middle" font-weight="normal" fill="#e6edf3">sets the mode</text>
<rect x="317" y="169" width="273" height="116" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="453.5" y="203.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Remediation: detect</text>
<text x="453.5" y="234.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">and fix, every 8</text>
<text x="453.5" y="265.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">hours</text>
<rect x="30" y="297" width="560" height="54" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="310" y="331.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Win32 app: engine and fallback task</text>
<line x1="320" y1="371" x2="320" y2="427" stroke="#9da7b3" stroke-width="3" marker-end="url(#ah)"/>
<text x="330" y="407" text-anchor="start" font-size="20" font-weight="bold" fill="#9da7b3">MDM + management agent</text>
<rect x="30" y="479" width="273" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="166.5" y="513.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Intune policy</text>
<text x="166.5" y="544.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">(PolicyManager)</text>
<rect x="317" y="479" width="273" height="85" rx="12" fill="#3a1517" stroke="#f06c6c" stroke-width="2"/>
<text x="453.5" y="513.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Legacy: GPO, WSUS,</text>
<text x="453.5" y="544.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">ConfigMgr</text>
<rect x="30" y="576" width="560" height="54" rx="12" fill="#12301e" stroke="#3fb96b" stroke-width="2"/>
<text x="310" y="610.2" text-anchor="middle" font-weight="bold" fill="#e6edf3">IntuneWUO engine: detect, fix, fallback</text>
<rect x="30" y="642" width="273" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="166.5" y="676.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Mode and settings</text>
<text x="166.5" y="707.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">(registry)</text>
<rect x="317" y="642" width="273" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="453.5" y="676.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Fallback task</text>
<text x="453.5" y="707.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">(SYSTEM)</text>
<rect x="30" y="739" width="273" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="166.5" y="773.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Windows Update</text>
<text x="166.5" y="804.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">stack</text>
<rect x="317" y="739" width="273" height="85" rx="12" fill="#14233f" stroke="#5b9dff" stroke-width="2"/>
<text x="453.5" y="788.7" text-anchor="middle" font-weight="normal" fill="#e6edf3">Logs and Event Log</text>
<line x1="320" y1="844" x2="320" y2="900" stroke="#9da7b3" stroke-width="3" marker-end="url(#ah)"/>
<text x="330" y="880" text-anchor="start" font-size="20" font-weight="bold" fill="#9da7b3">status line + logs</text>
<rect x="30" y="900" width="580" height="85" rx="12" fill="#1c2128" stroke="#6e7681" stroke-width="2"/>
<text x="320" y="934.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">Intune: Remediation output and Collect</text>
<text x="320" y="965.2" text-anchor="middle" font-weight="normal" fill="#e6edf3">diagnostics</text>
</svg>