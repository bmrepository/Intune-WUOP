name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell:
    name: Pester (Windows PowerShell module)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5+
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path .\tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  mcp:
    name: MCP server (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
